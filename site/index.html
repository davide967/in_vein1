// ============================================================================
// CICLO BIOLOGICO DELLA DONAZIONE (PULITO, SENZA BOTTONI INUTILI SOTTO)
// ============================================================================
function BarraGocciaProgressiva({
  timestampDonazione,
  setTimestampDonazione,
  giorniDemoOffset,
  setGiorniDemoOffset,
  tipoDonatrice,
  setTipoDonatrice,
  mostraNotifica
}) {
  const durate = { donna_120: 120, uomo_90: 90, plasma_30: 30 };
  const giorniTotali = durate[tipoDonatrice] || 120;

  const [oraAttuale, setOraAttuale] = useState(() => new Date());
  const [fasePreviewId, setFasePreviewId] = useState(null);

  useEffect(() => {
    const intervallo = setInterval(() => {
      setOraAttuale(new Date());
    }, 1000);
    return () => clearInterval(intervallo);
  }, []);

  const haDonato = timestampDonazione !== null;
  const msTrascorsi = haDonato
    ? Math.max(0, oraAttuale.getTime() - timestampDonazione) + giorniDemoOffset * 86400000
    : 0;

  const giorniReali = haDonato ? Math.floor(msTrascorsi / 86400000) + 1 : 0;
  const giorniTrascorsi = haDonato ? Math.min(giorniTotali, giorniReali) : 0;
  const percentuale = haDonato
    ? Math.min(100, Math.max(0, Math.round((giorniTrascorsi / giorniTotali) * 100)))
    : 0;
  const giorniMancanti = haDonato ? Math.max(0, giorniTotali - giorniTrascorsi) : giorniTotali;

  const oreOggi = Math.floor((msTrascorsi % 86400000) / 3600000);
  const minutiOggi = Math.floor((msTrascorsi % 3600000) / 60000);

  const dataDonazioneStr = haDonato
    ? new Date(timestampDonazione).toLocaleString('it-IT', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      })
    : '';

  const oraTelefonoStr = oraAttuale.toLocaleString('it-IT', {
    day: '2-digit',
    month: '2-digit',
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit'
  });

  const registraDonazioneOra = () => {
    const adesso = Date.now();
    setTimestampDonazione(adesso);
    setGiorniDemoOffset(0);
    setFasePreviewId(null);
    if (mostraNotifica) {
      mostraNotifica(
        'Ciclo Automatico Avviato! 🩸',
        'La goccia avanzerà automaticamente con data e ora del tuo dispositivo.',
        0
      );
    }
  };

  const selezionaTipo = (tipo) => {
    setTipoDonatrice(tipo);
    setFasePreviewId(null);
  };

  const tappeBiologiche = [
    {
      id: 'plasma',
      giornoTarget: 1,
      titolo: '24h',
      sottotitolo: 'Plasma 100%',
      icona: '💧',
      descrizione: 'In appena 24 ore il corpo rigenera completamente la parte liquida del sangue.'
    },
    {
      id: 'energia',
      giornoTarget: 7,
      titolo: '7g',
      sottotitolo: 'Energia Studio',
      icona: '⚡',
      descrizione: 'Dopo 7 giorni il midollo è attivo e la concentrazione per studio ed esami è al top.'
    },
    {
      id: 'globuli',
      giornoTarget: Math.min(30, Math.round(giorniTotali * 0.5)),
      titolo: `${Math.min(30, Math.round(giorniTotali * 0.5))}g`,
      sottotitolo: 'Globuli Rossi',
      icona: '🧬',
      descrizione: 'I nuovi globuli rossi trasportano ossigeno a pieno regime e il ferro si riequilibra.'
    },
    {
      id: 'pronta',
      giornoTarget: giorniTotali,
      titolo: `${giorniTotali}g`,
      sottotitolo: 'Fine Ciclo',
      icona: '🎉',
      descrizione: 'Intervallo di legge completato: l\'organismo è pronto per un\'eventuale nuova donazione.'
    }
  ];

  const tappaAutomatica = !haDonato
    ? tappeBiologiche[0]
    : percentuale >= 100
    ? tappeBiologiche[3]
    : giorniTrascorsi >= Math.min(30, Math.round(giorniTotali * 0.5))
    ? tappeBiologiche[2]
    : giorniTrascorsi >= 7
    ? tappeBiologiche[1]
    : tappeBiologiche[0];

  const tappaVisualizzata =
    tappeBiologiche.find((t) => t.id === fasePreviewId) || tappaAutomatica;

  return (
    <div className="bg-white p-5 rounded-3xl border border-stone-200/80 shadow-sm space-y-4">
      <div className="flex items-center justify-between gap-2">
        <div>
          <span className="text-[10px] font-black uppercase tracking-wider text-rose-700 bg-rose-50 px-2 py-0.5 rounded-md inline-block">
            Ciclo Automatico da Dispositivo
          </span>
          <h3 className="text-sm font-black text-stone-900 mt-0.5">
            Il Ciclo Dopo una Donazione
          </h3>
        </div>
        <span className="text-xs font-black text-rose-600 bg-rose-50 px-2.5 py-1 rounded-xl shrink-0">
          {haDonato ? `Giorno ${giorniTrascorsi} / ${giorniTotali}` : 'In attesa'}
        </span>
      </div>

      <div className="grid grid-cols-3 gap-1.5">
        <button
          onClick={() => selezionaTipo('donna_120')}
          className={`py-2 px-1 text-[11px] font-bold rounded-xl border transition ${
            tipoDonatrice === 'donna_120'
              ? 'bg-rose-600 text-white border-rose-600 shadow-sm'
              : 'bg-stone-50 text-stone-600 border-stone-200'
          }`}
        >
          Donna (120g)
        </button>
        <button
          onClick={() => selezionaTipo('uomo_90')}
          className={`py-2 px-1 text-[11px] font-bold rounded-xl border transition ${
            tipoDonatrice === 'uomo_90'
              ? 'bg-rose-600 text-white border-rose-600 shadow-sm'
              : 'bg-stone-50 text-stone-600 border-stone-200'
          }`}
        >
          Uomo (90g)
        </button>
        <button
          onClick={() => selezionaTipo('plasma_30')}
          className={`py-2 px-1 text-[11px] font-bold rounded-xl border transition ${
            tipoDonatrice === 'plasma_30'
              ? 'bg-amber-500 text-white border-amber-500 shadow-sm'
              : 'bg-stone-50 text-stone-600 border-stone-200'
          }`}
        >
          Plasma (30g)
        </button>
      </div>

      <div className="space-y-1.5 pt-1">
        <div className="relative w-full h-11 flex items-center">
          <div className="w-full h-3.5 bg-stone-100 rounded-full border border-stone-200 overflow-hidden">
            <div
              className={`h-full rounded-full transition-all duration-300 ${
                tipoDonatrice === 'plasma_30'
                  ? 'bg-gradient-to-r from-amber-300 to-amber-500'
                  : 'bg-gradient-to-r from-rose-300 to-rose-600'
              }`}
              style={{ width: `${percentuale}%` }}
            />
          </div>

          <div
            className="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 pointer-events-none transition-all duration-300 z-20"
            style={{ left: `${Math.max(5, Math.min(95, percentuale))}%` }}
          >
            <div
              className={`w-8 h-8 rounded-full flex items-center justify-center shadow-md border-2 border-white ${
                !haDonato
                  ? 'bg-stone-300 text-stone-600'
                  : percentuale >= 100
                  ? 'bg-emerald-500 text-white scale-110'
                  : tipoDonatrice === 'plasma_30'
                  ? 'bg-amber-500 text-white'
                  : 'bg-rose-600 text-white'
              }`}
            >
              {percentuale >= 100 ? (
                <Check className="w-4 h-4 stroke-[3]" />
              ) : (
                <Droplet className="w-4 h-4 fill-current" />
              )}
            </div>
          </div>
        </div>

        <div className="flex items-center justify-between text-[11px] text-stone-500 font-medium px-1 gap-2">
          <span className="truncate">
            {haDonato
              ? `🕒 Avviato il ${dataDonazioneStr}`
              : '🕒 Si sincronizza con data e ora del telefono'}
          </span>
          <span className="font-bold text-stone-800 shrink-0">
            {!haDonato
              ? `${giorniTotali}g intervallo`
              : percentuale >= 100
              ? 'Ciclo completato!'
              : `-${giorniMancanti}g (${oreOggi}h ${minutiOggi}m)`}
          </span>
        </div>
      </div>

      {!haDonato ? (
        <button
          onClick={registraDonazioneOra}
          className="w-full py-3 bg-rose-600 hover:bg-rose-700 text-white rounded-2xl text-xs font-black shadow-md shadow-rose-600/20 transition active:scale-95"
        >
          🩸 Ho effettuato la donazione (Avvia ciclo automatico)
        </button>
      ) : (
        <div className="flex items-center justify-between bg-stone-50 px-3 py-2 rounded-2xl border border-stone-200/80 text-[11px]">
          <span className="text-stone-600 font-semibold">
            🕒 Ora dispositivo: <strong className="text-stone-900">{oraTelefonoStr}</strong>
          </span>
          <div className="flex items-center space-x-1.5 shrink-0">
            <button
              onClick={() => setGiorniDemoOffset((d) => d + 15)}
              className="px-2 py-1 bg-rose-50 hover:bg-rose-100 text-rose-700 rounded-lg font-black transition"
            >
              ⏩ +15g Demo
            </button>
            <button
              onClick={() => {
                setTimestampDonazione(null);
                setGiorniDemoOffset(0);
              }}
              className="px-2 py-1 bg-stone-200 hover:bg-stone-300 text-stone-700 rounded-lg font-bold transition"
            >
              Reset
            </button>
          </div>
        </div>
      )}

      <div className="grid grid-cols-4 gap-1.5">
        {tappeBiologiche.map((t) => {
          const raggiunta = haDonato && giorniTrascorsi >= t.giornoTarget;
          const selezionata = tappaVisualizzata.id === t.id;
          return (
            <button
              key={t.id}
              onClick={() => setFasePreviewId(t.id)}
              className={`p-2 rounded-2xl border text-center transition ${
                raggiunta
                  ? 'bg-rose-50/80 border-rose-300 text-rose-900'
                  : selezionata
                  ? 'bg-stone-100 border-stone-400 text-stone-800'
                  : 'bg-stone-50 border-stone-200 text-stone-400 hover:bg-stone-100'
              }`}
            >
              <span className="text-sm block">{t.icona}</span>
              <span className="text-[10px] font-black block mt-0.5">{t.titolo}</span>
              <span className="text-[9px] font-semibold block truncate">{t.sottotitolo}</span>
            </button>
          );
        })}
      </div>

      <div className="p-3.5 bg-stone-50 rounded-2xl border border-stone-200/90 flex items-start space-x-2.5">
        <span className="text-lg shrink-0">{tappaVisualizzata.icona}</span>
        <p className="text-xs text-stone-700 leading-snug">
          <strong className="text-stone-900">{tappaVisualizzata.sottotitolo}: </strong>
          {tappaVisualizzata.descrizione}
        </p>
      </div>
    </div>
  );
}

// ============================================================================
// FINESTRA TUTOR AMPIA E STRUTTURATA (STORIA, PERCORSO PASSO-PASSO, CHAT)
// ============================================================================
function ModaleTutorGrande({
  tutor,
  onClose,
  tutorSceltoId,
  setTutorSceltoId,
  setPasso2Completato,
  setSchedaAttiva,
  mostraNotifica
}) {
  const [messaggi, setMessaggi] = useState([
    {
      id: 1,
      mittente: 'tutor',
      testo: `Ciao Serena! Sono ${tutor.nome} (${tutor.area}). ${tutor.storia} Se hai qualsiasi timore, chiedimi pure tutto quello che vuoi prima di fissare la visita!`,
      orario: '09:30'
    }
  ]);
  const [inputMsg, setInputMsg] = useState('');
  const [staScrivendo, setStaScrivendo] = useState(false);

  const inviaMessaggio = (testo) => {
    const msg = testo || inputMsg;
    if (!msg.trim()) return;

    setMessaggi((prev) => [
      ...prev,
      {
        id: Date.now(),
        mittente: 'utente',
        testo: msg,
        orario: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      }
    ]);
    setInputMsg('');
    setStaScrivendo(true);

    setTimeout(() => {
      setStaScrivendo(false);
      const t = msg.toLowerCase();
      let risposta = `Perfetto Serena! Dimmi pure quando preferisci fare la visita così ci troviamo 10 minuti prima davanti alla sede AVIS.`;
      if (t.includes('svenire') || t.includes('ago') || t.includes('paura')) {
        risposta = `È la paura più comune! Ricorda che alla 1ª volta in AVIS si fa la Visita di Idoneità (colloquio + piccole provette di analisi), non la donazione intera. Resto vicino a te in sala d'attesa per farti forza!`;
      } else if (t.includes('tempo') || t.includes('resti')) {
        risposta = `Resto con te dall'ingresso fino all'uscita! Solo il colloquio con il medico è privato per la tua privacy, poi torniamo insieme.`;
      } else if (t.includes('dove') || t.includes('incontriamo')) {
        risposta = `Ci vediamo proprio davanti al cancello della sede AVIS che sceglierai (Via Taramelli 7 o San Matteo) 10 minuti prima. Così entriamo insieme e non ti senti spaesata!`;
      }

      setMessaggi((prev) => [
        ...prev,
        {
          id: Date.now() + 1,
          mittente: 'tutor',
          testo: risposta,
          orario: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        }
      ]);
    }, 650);
  };

  const confermaTutor = () => {
    setTutorSceltoId(tutor.id);
    setPasso2Completato(true);
    mostraNotifica(`${tutor.nome} è il tuo Tutor! 🤝`, 'Accordati direttamente in chat per il giorno della visita.', 0);
    onClose();
    setSchedaAttiva('visita');
  };

  return (
    <div className="absolute inset-0 z-50 bg-[#FDFBF7] flex flex-col animate-in fade-in duration-150">
      {/* HEADER GRANDE CON TASTO CHIUDI IN ALTO A DESTRA */}

function ModaleCouponLive({ coupon, onClose }) {
  const [secondi, setSecondi] = useState(300);

  useEffect(() => {
    if (secondi <= 0) return;
    const t = setInterval(() => {
      setSecondi((s) => (s > 0 ? s - 1 : 0));
    }, 1000);
    return () => clearInterval(t);
  }, [secondi]);

  if (!coupon) return null;

  const min = Math.floor(secondi / 60);
  const sec = secondi % 60;
  const tempo = `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;

  return (
    <div className="fixed inset-0 z-50 bg-stone-900/80 backdrop-blur-sm flex items-center justify-center p-4">

          </span>
          <div className={`text-3xl font-mono font-black ${secondi < 60 ? 'text-rose-600' : 'text-stone-900'}`}>

  setGocceConoscenza,
  aggiungiGocce,
  avatar,
  profilo,

  const [sottoTab, setSottoTab] = useState('premi'); // 'premi' | 'classifiche' | 'giochi'

  // Stato dei 6 Giochi

  const [rispGiornaliere, setRispGiornaliere] = useState({});
  const [bauleRiscattato, setBauleRiscattato] = useState({});
  const [rispVeroFalso, setRispVeroFalso] = useState({});
  const [rispCompatibilita, setRispCompatibilita] = useState({});

  // Stato Gioco 4: Zaino AVIS
  const [zainoScelti, setZainoScelti] = useState([]);
  const [zainoCompletato, setZainoCompletato] = useState(false);

  // Stato Gioco 5: Parola Misteriosa
  const [indiceParola, setIndiceParola] = useState(0);
  const [inputParola, setInputParola] = useState('');
  const [paroleIndovinate, setParoleIndovinate] = useState({});

  // --- 1. CATALOGO PREMI MATERIALE UNIVERSITARIO (RIPROPORZIONATI) ---
  const catalogoPremiUniversitari = [
    {
      id: 'caffe_studio',
      titolo: '☕ Carnet 5 Colazioni & Caffè da Sessione Esami',
      desc: '5 buoni per caffè/cappuccino + brioche tra una lezione e l\'altra.',
      luogo: 'Bar San Tommaso / Bar Cortile Centrale',
      costo: 150
    },
    {
      id: 'stampe',

      desc: '150 stampe/fotocopie di slide, dispense d\'esame o rilegatura bozze tesi.',

    },

  const riscattaPremio = (premio) => {
    if (gocceConoscenza < premio.costo) {
      mostraNotifica('Punti insufficienti', `Ti mancano ${premio.costo - gocceConoscenza} punti per questo premio.`, 0);
      return;
    }
    setGocceConoscenza((p) => p - premio.costo);
    const codice = `UNIPV-MAT-${Math.floor(1000 + Math.random() * 9000)}`;
    setCouponAttivo({ ...premio, codice });
    mostraNotifica('Premio Riscattato! 🎁', `Mostra il buono in cassa (${premio.costo} pt).`, -premio.costo);
  };

  // --- 2. CLASSIFICA 5 MACRO-GRUPPI DIPARTIMENTALI UNIPV ---
  const classificaMacroAree = MACRO_DIPARTIMENTI_UNIPV.map((nomeArea, index) => {
    const isMio = nomeArea === profilo.facolta;
    const puntiBase = 4800 - index * 320;
    const puntiTotali = puntiBase + (isMio ? gocceConoscenza : 0);
    return {
      nome: nomeArea,
      punti: puntiTotali,
      studenti: 210 - index * 25 + (isMio ? 1 : 0),
      isMio
    };
  }).sort((a, b) => b.punti - a.punti);

  const maxPuntiArea = Math.max(...classificaMacroAree.map((a) => a.punti));
  const miaPosizioneArea = classificaMacroAree.findIndex((a) => a.isMio) + 1;

  // --- DATI GIOCO 1: QUIZ GIORNALIERO (3 GIORNATE / 9 DOMANDE, +2 PT L'UNA, +5 PT BONUS SE 3/3) ---
  const databaseGiornaliero = [
    { id: 'g1_1', g: 1, q: 'Qual è il 1° passo ufficiale su avis.pv.it per diventare donatore?', opts: ['Prenotare la Visita di Idoneità', 'Presentarsi a caso senza visita', 'Pagare le analisi'], corr: 0 },
    { id: 'g1_2', g: 1, q: 'In quanto tempo il corpo recupera la parte liquida (plasma)?', opts: ['In 30 giorni', 'In circa 24 ore', 'In 6 mesi'], corr: 1 },
    { id: 'g1_3', g: 1, q: 'Qual è l\'età per candidarsi per la 1ª volta in AVIS?', opts: ['Dai 25 anni', 'Solo sotto i 30 anni', 'Tra 18 e 60 anni (peso > 50 kg)'], corr: 2 },

    { id: 'g2_1', g: 2, q: 'Dove si trova la sede dell\'AVIS Comunale a Pavia?', opts: ['Via Taramelli 7, Pavia', 'Piazza della Vittoria', 'Castello Visconteo'], corr: 0 },
    { id: 'g2_2', g: 2, q: 'A cosa serve il plasma raccolto con la plasmaferesi?', opts: ['Solo per idratare', 'A produrre farmaci salvavita (immunoglobuline, albumina)', 'Non viene usato'], corr: 1 },
    { id: 'g2_3', g: 2, q: 'Ogni quanto possono donare il sangue intero le donne in età fertile?', opts: ['Ogni 30 giorni', 'Una volta ogni 2 anni', 'Ogni 120 giorni (max 2 volte l\'anno)'], corr: 2 },

    { id: 'g3_1', g: 3, q: 'Quale componente permette di rigenerare il corpo in meno tempo dopo il prelievo?', opts: ['Il Sangue Intero', 'Il Plasma (già dopo 14-30 giorni)', 'Le Piastrine solo ogni anno'], corr: 1 },
    { id: 'g3_2', g: 3, q: 'Cosa riceve il donatore gratuitamente dopo ogni visita e prelievo?', opts: ['Analisi ematochimiche complete gratuite', 'Solo un certificato cartaceo', 'Niente'], corr: 0 },
    { id: 'g3_3', g: 3, q: 'Quanti ml di sangue intero vengono prelevati in una donazione standard?', opts: ['1,5 litri', '100 ml', '450 ml (± 10%)'], corr: 2 }
  ];

  const quizOggi = databaseGiornaliero.filter((x) => x.g === giornoQuiz);
  const completatiOggi = quizOggi.every((x) => rispGiornaliere[x.id] !== undefined);
  const corretteOggiCount = quizOggi.filter((x) => rispGiornaliere[x.id] === x.corr).length;
  const tutteCorretteOggi = completatiOggi && corretteOggiCount === quizOggi.length;

  const rispondiGiornaliero = (q, idx) => {
    if (rispGiornaliere[q.id] !== undefined) return;
    setRispGiornaliere((prev) => ({ ...prev, [q.id]: idx }));
    if (idx === q.corr) {
      aggiungiGocce(2);
      mostraNotifica('Risposta Esatta! 🎯', '+2 Punti guadagnati!', 2);
    } else {
      mostraNotifica('Risposta Errata', 'Nessun punto: ricorda che servono 3/3 corrette per il bonus giornaliero.', 0);
    }
  };

  const apriBauleGiornaliero = () => {
    if (!completatiOggi || bauleRiscattato[giornoQuiz]) return;
    if (!tutteCorretteOggi) {
      mostraNotifica(
        'Bonus Non Sbloccato ❌',
        `Hai risposto correttamente a ${corretteOggiCount}/3: il bonus +5 pt si ottiene solo con tutte le risposte corrette!`,
        0
      );
      return;
    }
    setBauleRiscattato((prev) => ({ ...prev, [giornoQuiz]: true }));
    aggiungiGocce(5);
    mostraNotifica('Bonus Giornaliero Sbloccato! 🎁', '+5 Punti Extra per aver fatto 3/3!', 5);
  };

  // --- DATI GIOCO 2: VERO O FALSO LAMPO (6 MITI, +1 PT) ---
  const sfideVeroFalso = [
    { id: 'vf1', testo: 'Il sangue umano può essere prodotto artificialmente in laboratorio.', corr: 'Falso', spieg: 'Falso! La donazione volontaria è l\'unica fonte al mondo per il sangue.' },
    { id: 'vf2', testo: 'La Legge 219/2005 garantisce il riposo retribuito ai lavoratori e giustificazione per studenti.', corr: 'Vero', spieg: 'Vero! Chi dona ha diritto a tutela formale sul lavoro e all\'università.' },
    { id: 'vf3', testo: 'Su avis.pv.it prima della 1ª donazione fai sempre la Visita di Idoneità con esami gratuiti.', corr: 'Vero', spieg: 'Vero! Così verifichi i valori ematici in totale sicurezza.' },
    { id: 'vf4', testo: 'Donare il sangue fa ingrassare o abbassa il metabolismo.', corr: 'Falso', spieg: 'Falso! Aiuta invece a monitorare costantemente colesterolo e glicemia.' },
    { id: 'vf5', testo: 'Una sola donazione può aiutare fino a 3 pazienti diversi.', corr: 'Vero', spieg: 'Vero! Il sangue viene diviso in globuli rossi, plasma e piastrine.' },
    { id: 'vf6', testo: 'Chi assume la pillola anticoncezionale non può mai donare il sangue.', corr: 'Falso', spieg: 'Falso! La pillola anticoncezionale è pienamente compatibile con la donazione.' }
  ];

  const rispondiVF = (item, scelta) => {
    if (rispVeroFalso[item.id] !== undefined) return;
    setRispVeroFalso((prev) => ({ ...prev, [item.id]: scelta }));
    if (scelta === item.corr) {
      aggiungiGocce(1);
      mostraNotifica('Vero/Falso Esatto! ⚡', '+1 Punto guadagnato!', 1);
    }
  };

  // --- DATI GIOCO 3: COMPATIBILITA GRUPPI SANGUIGNI (+2 PT) ---
  const casiCompatibilita = [
    { id: 'c1', domanda: 'Un paziente in emergenza ha gruppo A+ e servono globuli rossi urgenti. Quale gruppo può donare sempre a tutti in emergenza?', opts: ['0 Rh- (Donatore Universale)', 'AB+ (Ricevitore)', 'Solo B-'], corr: 0 },

  ];

  const rispondiCompat = (caso, idx) => {
    if (rispCompatibilita[caso.id] !== undefined) return;
    setRispCompatibilita((prev) => ({ ...prev, [caso.id]: idx }));
    if (idx === caso.corr) {
      aggiungiGocce(2);
      mostraNotifica('Caso Risolto! 🩸', '+2 Punti per la tua competenza!', 2);
    }
  };

  // --- DATI GIOCO 4: PREPARA LO ZAINO PER LA VISITA AVIS (+5 PT) ---
  const oggettiZaino = [
    { id: 'z1', label: '🪪 Tessera Sanitaria & Documento', giusto: true },
    { id: 'z2', label: '🥛 Bottiglione di Latte Intero', giusto: false },
    { id: 'z3', label: '💧 Bottiglietta d\'Acqua (500 ml)', giusto: true },
    { id: 'z4', label: '🥐 Fette Biscottate / Frutta', giusto: true },
    { id: 'z5', label: '💊 Aspirina presa stamattina', giusto: false },
    { id: 'z6', label: '👕 Maglietta a maniche comode', giusto: true },
    { id: 'z7', label: '🏋️ Pesi da 10 kg per allenarsi subito', giusto: false }
  ];

  const toggleZaino = (item) => {
    if (zainoCompletato) return;
    if (zainoScelti.includes(item.id)) {
      setZainoScelti((prev) => prev.filter((x) => x !== item.id));

      setZainoScelti((prev) => [...prev, item.id]);

  };

  const verificaZaino = () => {
    if (zainoCompletato) return;
    const giustiIds = oggettiZaino.filter((x) => x.giusto).map((x) => x.id);
    const tuttoGiusto = zainoScelti.length === 4 && giustiIds.every((id) => zainoScelti.includes(id));

    if (tuttoGiusto) {
      setZainoCompletato(true);

      mostraNotifica('Zaino Perfetto! 🎒', '+5 Punti! Sei pronta per la visita in AVIS.', 5);

  // --- DATI GIOCO 5: PAROLA MISTERIOSA EMATICA (+3 PT) ---

    { parola: 'PLASMA', indizio: 'La componente liquida giallognola del sangue che si recupera in 24 ore (6 lettere)' },

      setParoleIndovinate((prev) => ({ ...prev, [parolaAttuale.parola]: true }));

  const carteIniziali = [
    { id: 1, coppiaId: '0neg', label: '0 Rh-' },
    { id: 2, coppiaId: '0neg', label: 'Donatore Univ.' },
    { id: 3, coppiaId: 'abpos', label: 'AB Rh+' },
    { id: 4, coppiaId: 'abpos', label: 'Ricevitore Univ.' },
    { id: 5, coppiaId: 'plasma', label: 'Plasma' },
    { id: 6, coppiaId: 'plasma', label: 'Recupero 24h' },
    { id: 7, coppiaId: 'visita', label: '1° Passo AVIS' },
    { id: 8, coppiaId: 'visita', label: 'Visita Idoneità' }
  ];

  const [carte, setCarte] = useState(() => [...carteIniziali]);
  const [scoperte, setScoperte] = useState([]);
  const [indovinate, setIndovinate] = useState([]);

  const giraCarta = (c) => {
    if (scoperte.length === 2 || scoperte.includes(c.id) || indovinate.includes(c.coppiaId)) return;
    const nuove = [...scoperte, c.id];
    setScoperte(nuove);
    if (nuove.length === 2) {
      const c1 = carte.find((x) => x.id === nuove[0]);
      const c2 = carte.find((x) => x.id === nuove[1]);
      if (c1.coppiaId === c2.coppiaId) {
        const nuoveInd = [...indovinate, c1.coppiaId];
        setIndovinate(nuoveInd);
        setScoperte([]);
        if (nuoveInd.length === 4) {
          aggiungiGocce(4);
          mostraNotifica('Memory Vinto! 🃏', '+4 Punti guadagnati!', 4);
        }
      } else {
        setTimeout(() => setScoperte([]), 650);
      }
    }
  };

  return (
    <div className="space-y-4">
      {/* HEADER SALDO PUNTI & GUARDAROBA GOCCIA */}
      <div className="bg-white rounded-3xl p-4 border border-stone-200/80 shadow-sm flex items-center justify-between">
        <div className="flex items-center space-x-3">
          <CustomAvatar config={avatar} size="md" felice={true} onClick={() => setModaleAvatarAperta(true)} />
          <div>
            <span className="text-[10px] font-black uppercase text-stone-400 block">I tuoi Punti</span>
            <div className="text-base font-black text-rose-600">{gocceConoscenza} Punti</div>
          </div>
        </div>
        <button
          onClick={() => setModaleAvatarAperta(true)}
          className="px-3.5 py-2 bg-stone-900 hover:bg-stone-800 text-white rounded-xl text-xs font-black transition"
        >
          Vesti Goccia ✨
        </button>
      </div>

      {/* 3 SOTTOSCHEDE CHIARE */}
      <div className="flex bg-stone-100 p-1 rounded-2xl border border-stone-200 text-xs font-bold">
        <button
          onClick={() => setSottoTab('premi')}
          className={`flex-1 py-2 rounded-xl transition ${
            sottoTab === 'premi' ? 'bg-white text-stone-900 shadow-sm' : 'text-stone-500'
          }`}
        >
          🎓 Materiale Studio
        </button>
        <button
          onClick={() => setSottoTab('classifiche')}
          className={`flex-1 py-2 rounded-xl transition ${
            sottoTab === 'classifiche' ? 'bg-white text-stone-900 shadow-sm' : 'text-stone-500'
          }`}
        >
          🏆 Macro-Aree
        </button>
        <button
          onClick={() => setSottoTab('giochi')}
          className={`flex-1 py-2 rounded-xl transition ${
            sottoTab === 'giochi' ? 'bg-white text-stone-900 shadow-sm' : 'text-stone-500'
          }`}
        >
          🎮 6 Giochi
        </button>
      </div>

      {/* TAB 1: PREMI MATERIALE UNIVERSITARIO */}
      {sottoTab === 'premi' && (
        <div className="space-y-3">
          <div className="px-1">
            <h3 className="text-sm font-black text-stone-900">
              Premi Materiale Universitario a Pavia
            </h3>
            <p className="text-xs text-stone-500">
              Accumula punti con i bonus mensili della tua macro-area e i minigiochi per riscattare buoni reali.
            </p>
          </div>

          {catalogoPremiUniversitari.map((p) => {
            const riscattabile = gocceConoscenza >= p.costo;
            return (
              <div key={p.id} className="bg-white rounded-3xl p-4 border border-stone-200/80 shadow-sm space-y-2.5">
                <div className="flex items-start justify-between space-x-2">
                  <div>
                    <h4 className="text-xs font-black text-stone-900">{p.titolo}</h4>
                    <p className="text-[11px] text-stone-500 mt-0.5">📍 {p.luogo}</p>
                  </div>
                  <span className="px-2.5 py-1 bg-rose-50 text-rose-700 rounded-xl text-xs font-black shrink-0">
                    {p.costo.toLocaleString()} pt
                  </span>
                </div>
                <p className="text-xs text-stone-600 leading-snug">{p.desc}</p>
                <button
                  onClick={() => riscattaPremio(p)}
                  disabled={!riscattabile}
                  className={`w-full py-2.5 rounded-2xl text-xs font-black transition ${
                    riscattabile
                      ? 'bg-rose-600 hover:bg-rose-700 text-white shadow-sm'
                      : 'bg-stone-100 text-stone-400 cursor-not-allowed'
                  }`}
                >
                  {riscattabile ? `Riscatta Buono (${p.costo.toLocaleString()} pt)` : `Mancano ${(p.costo - gocceConoscenza).toLocaleString()} punti`}
                </button>
              </div>
            );
          })}
        </div>
      )}

      {/* TAB 2: CLASSIFICA 5 MACRO-GRUPPI DIPARTIMENTALI UNIPV CON PREMI MENSILI */}
      {sottoTab === 'classifiche' && (
        <div className="space-y-3">
          <div className="bg-white rounded-3xl p-4 border border-stone-200/80 shadow-sm space-y-2.5">
            <div className="flex items-center justify-between">
              <h3 className="text-sm font-black text-stone-900">
                Classifica Mensile Macro-Aree UniPv
              </h3>
              <span className="text-[11px] font-black text-rose-600 bg-rose-50 px-2.5 py-0.5 rounded-full">
                La tua: #{miaPosizioneArea}
              </span>
            </div>
            <p className="text-[11px] text-stone-500 leading-snug">
              A fine mese, ogni studente iscritto nelle prime 3 macro-aree riceve automaticamente il bonus sul proprio profilo (facoltà bloccata per prevenire cambi strategici).
            </p>
            <div className="grid grid-cols-3 gap-1.5 pt-1 text-center">
              <div className="p-2 rounded-xl bg-amber-50 border border-amber-200">
                <span className="text-xs block">🥇 1ª Area</span>
                <span className="text-[10px] font-black text-amber-900">+100 pt / stud.</span>
              </div>
              <div className="p-2 rounded-xl bg-stone-100 border border-stone-200">
                <span className="text-xs block">🥈 2ª Area</span>
                <span className="text-[10px] font-black text-stone-800">+55 pt / stud.</span>
              </div>
              <div className="p-2 rounded-xl bg-orange-50 border border-orange-200">
                <span className="text-xs block">🥉 3ª Area</span>
                <span className="text-[10px] font-black text-orange-900">+25 pt / stud.</span>
              </div>
            </div>
          </div>

          <div className="space-y-2.5">
            {classificaMacroAree.map((a, idx) => {
              const perc = Math.round((a.punti / maxPuntiArea) * 100);
              const premioMensile = idx === 0 ? 100 : idx === 1 ? 55 : idx === 2 ? 25 : 0;
              return (
                <div
                  key={a.nome}
                  className={`p-4 rounded-2xl border transition ${
                    a.isMio
                      ? 'bg-rose-50/70 border-rose-400 ring-2 ring-rose-500/20'
                      : 'bg-white border-stone-200/80'
                  }`}
                >
                  <div className="flex items-center justify-between">
                    <div className="flex items-center space-x-2.5 flex-1 min-w-0 pr-2">
                      <span className={`w-7 h-7 rounded-xl flex items-center justify-center font-black text-xs shrink-0 ${
                        idx === 0 ? 'bg-amber-100 text-amber-800'
                        : idx === 1 ? 'bg-stone-200 text-stone-700'
                        : idx === 2 ? 'bg-orange-100 text-orange-800'
                        : 'bg-stone-100 text-stone-500'
                      }`}>
                        {idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `#${idx + 1}`}
                      </span>
                      <div className="min-w-0">
                        <div className="flex items-center space-x-1.5">
                          <h4 className="text-xs font-black text-stone-900 leading-tight">{a.nome}</h4>
                          {a.isMio && (
                            <span className="px-1.5 py-0.5 bg-rose-600 text-white rounded text-[9px] font-black shrink-0">
                              Tu
                            </span>
                          )}
                        </div>
                        <div className="flex flex-wrap items-center gap-1.5 mt-0.5">
                          <p className="text-[10px] text-stone-500">{a.studenti} studenti partecipano</p>
                          {premioMensile > 0 && (
                            <span className="px-1.5 py-0.5 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded text-[9px] font-black">
                              +{premioMensile} pt a studente a fine mese
                            </span>
                          )}
                        </div>
                      </div>
                    </div>
                    <span className="text-xs font-black text-stone-900 shrink-0">
                      {a.punti.toLocaleString()} pt
                    </span>
                  </div>

                  <div className="h-1.5 w-full bg-stone-100 rounded-full mt-2.5 overflow-hidden">
                    <div
                      className={`h-full rounded-full ${a.isMio ? 'bg-rose-600' : 'bg-stone-800'}`}
                      style={{ width: `${perc}%` }}
                    />
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* TAB 3: TUTTI E 6 I GIOCHI INTERATTIVI */}
      {sottoTab === 'giochi' && (
        <div className="space-y-3">
          {/* Selettore orizzontale dei 6 giochi */}
          <div className="flex space-x-1.5 overflow-x-auto no-scrollbar pb-1 text-xs">
            {[
              { id: 'giornaliero', label: '🎯 Quiz Oggi' },
              { id: 'verofalso', label: '⚡ Vero/Falso' },
              { id: 'compatibilita', label: '🩸 Compatibilità' },
              { id: 'zaino', label: '🎒 Zaino AVIS' },
              { id: 'parola', label: '🔤 Parola' },
              { id: 'memory', label: '🃏 Memory' }
            ].map((g) => (
              <button
                key={g.id}
                onClick={() => setGiocoAttivo(g.id)}
                className={`px-3 py-2 rounded-xl font-bold shrink-0 border transition ${
                  giocoAttivo === g.id
                    ? 'bg-stone-900 text-white border-stone-900 shadow-sm'
                    : 'bg-white text-stone-700 border-stone-200 hover:bg-stone-50'
                }`}
              >
                {g.label}
              </button>
            ))}
          </div>

          {/* GIOCO 1: QUIZ GIORNALIERO (3 GIORNATE, +2 PT L'UNA, +5 PT BONUS CON 3/3 ESATTE) */}
          {giocoAttivo === 'giornaliero' && (
            <div className="space-y-3">
              <div className="flex items-center justify-between px-1">
                <span className="text-xs font-black text-stone-800">
                  Giorno #{giornoQuiz} di 3 (+2 pt a domanda)
                </span>
                <button
                  onClick={() => setGiornoQuiz(giornoQuiz >= 3 ? 1 : giornoQuiz + 1)}
                  className="text-[11px] font-bold text-rose-600 underline"
                >
                  Simula Giorno {giornoQuiz >= 3 ? 1 : giornoQuiz + 1} →
                </button>
              </div>

              {quizOggi.map((q) => {
                const scelto = rispGiornaliere[q.id];
                const giaFatto = scelto !== undefined;
                return (
                  <div key={q.id} className="bg-white rounded-3xl p-4 border border-stone-200/80 shadow-sm space-y-2">
                    <h4 className="text-xs font-black text-stone-900">{q.q}</h4>
                    <div className="space-y-1.5 text-xs">
                      {q.opts.map((opz, idx) => {
                        let cls = 'bg-stone-50 border-stone-200 text-stone-700 hover:bg-stone-100';
                        if (giaFatto) {
                          if (idx === q.corr) cls = 'bg-emerald-50 border-emerald-500 text-emerald-900 font-bold';
                          else if (idx === scelto) cls = 'bg-rose-50 border-rose-400 text-rose-900 line-through';
                        }
                        return (
                          <button
                            key={idx}
                            disabled={giaFatto}
                            onClick={() => rispondiGiornaliero(q, idx)}
                            className={`w-full text-left p-2.5 rounded-xl border transition ${cls}`}
                          >
                            {opz}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                );
              })}

              <div className={`p-4 rounded-3xl border flex items-center justify-between gap-2 ${
                bauleRiscattato[giornoQuiz] ? 'bg-emerald-50 border-emerald-200'
                : tutteCorretteOggi ? 'bg-amber-50 border-amber-300'
                : completatiOggi ? 'bg-rose-50/70 border-rose-200'
                : 'bg-white border-stone-200'
              }`}>
                <div>
                  <span className="text-xs font-black text-stone-900 block">🎁 Bonus Giorno #{giornoQuiz} (+5 pt)</span>
                  <span className="text-[11px] text-stone-600">
                    {bauleRiscattato[giornoQuiz]
                      ? 'Bonus 3/3 già sbloccato oggi!'
                      : tutteCorretteOggi
                      ? 'Tutte 3 corrette! Sblocca il bonus extra'
                      : completatiOggi
                      ? `Hai fatto ${corretteOggiCount}/3: serve 3/3 esatte per il bonus`
                      : 'Rispondi correttamente a tutti e 3 i quiz per sbloccare +5 pt'}
                  </span>
                </div>
                {completatiOggi && !bauleRiscattato[giornoQuiz] && (
                  <button
                    onClick={apriBauleGiornaliero}
                    className={`px-3.5 py-2 rounded-xl text-xs font-black shadow-sm shrink-0 ${
                      tutteCorretteOggi
                        ? 'bg-amber-500 hover:bg-amber-600 text-white'
                        : 'bg-rose-100 text-rose-700 border border-rose-300'
                    }`}
                  >
                    {tutteCorretteOggi ? 'Apri +5 pt' : `Bloccato (${corretteOggiCount}/3)`}
                  </button>
                )}
              </div>
            </div>
          )}

          {/* GIOCO 2: VERO O FALSO LAMPO (+1 PT) */}
          {giocoAttivo === 'verofalso' && (
            <div className="space-y-3">
              {sfideVeroFalso.map((item) => {
                const risp = rispVeroFalso[item.id];
                return (
                  <div key={item.id} className="bg-white rounded-3xl p-4 border border-stone-200/80 shadow-sm space-y-2 text-xs">
                    <div className="flex items-center justify-between gap-2">
                      <span className="text-[10px] font-black uppercase text-rose-700 bg-rose-50 px-2 py-0.5 rounded-md">
                        Vero / Falso • +1 pt
                      </span>
                    </div>
                    <p className="font-black text-stone-900">{item.testo}</p>
                    <div className="grid grid-cols-2 gap-2">
                      {['Vero', 'Falso'].map((op) => (
                        <button
                          key={op}
                          disabled={risp !== undefined}
                          onClick={() => rispondiVF(item, op)}
                          className={`py-2 rounded-xl font-black border transition ${
                            risp !== undefined
                              ? item.corr === op
                                ? 'bg-emerald-600 text-white border-emerald-600'
                                : risp === op
                                ? 'bg-rose-600 text-white border-rose-600'
                                : 'bg-stone-50 text-stone-400 border-stone-200'
                              : 'bg-stone-50 hover:bg-stone-100 text-stone-800 border-stone-200'
                          }`}
                        >
                          {op}
                        </button>
                      ))}
                    </div>
                    {risp && (
                      <p className="text-[11px] text-stone-600 bg-stone-50 p-2.5 rounded-xl border border-stone-200">
                        {item.spieg}
                      </p>
                    )}
                  </div>
                );
              })}
            </div>
          )}

          {/* GIOCO 3: COMPATIBILITÀ GRUPPI SANGUIGNI (+2 PT) */}
          {giocoAttivo === 'compatibilita' && (
            <div className="space-y-3">
              {casiCompatibilita.map((c) => {
                const risp = rispCompatibilita[c.id];
                const fatto = risp !== undefined;
                return (
                  <div key={c.id} className="bg-white rounded-3xl p-4 border border-stone-200/80 shadow-sm space-y-2.5 text-xs">
                    <span className="text-[10px] font-black uppercase text-rose-700 bg-rose-50 px-2 py-0.5 rounded-md">
                      Caso Clinico • +2 pt
                    </span>
                    <p className="font-black text-stone-900 leading-snug">{c.domanda}</p>
                    <div className="space-y-1.5">
                      {c.opts.map((opt, idx) => (
                        <button
                          key={idx}
                          disabled={fatto}
                          onClick={() => rispondiCompat(c, idx)}
                          className={`w-full text-left p-2.5 rounded-xl border transition ${
                            fatto
                              ? idx === c.corr
                                ? 'bg-emerald-50 border-emerald-500 text-emerald-900 font-bold'
                                : risp === idx
                                ? 'bg-rose-50 border-rose-400 text-rose-900 line-through'
                                : 'bg-stone-50 text-stone-400 border-stone-200'
                              : 'bg-stone-50 hover:bg-stone-100 text-stone-700 border-stone-200'
                          }`}
                        >
                          {opt}
                        </button>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {/* GIOCO 4: PREPARA LO ZAINO PER LA VISITA AVIS (+5 PT) */}
          {giocoAttivo === 'zaino' && (
            <div className="bg-white rounded-3xl p-5 border border-stone-200/80 shadow-sm space-y-3.5 text-xs">
              <div>
                <h3 className="text-sm font-black text-stone-900">
                  Prepara lo Zaino per la Visita AVIS (+5 pt)
                </h3>
                <p className="text-[11px] text-stone-500 mt-0.5">
                  Seleziona esattamente i <strong>4 oggetti utili</strong> ed evita i 3 sbagliati prima di uscire di casa!
                </p>
              </div>

              <div className="grid grid-cols-1 gap-2">
                {oggettiZaino.map((obj) => {
                  const scelto = zainoScelti.includes(obj.id);
                  return (
                    <button
                      key={obj.id}
                      onClick={() => toggleZaino(obj)}
                      className={`p-3 rounded-2xl border flex items-center justify-between font-bold transition ${
                        zainoCompletato
                          ? obj.giusto
                            ? 'bg-emerald-50 border-emerald-500 text-emerald-900'
                            : 'bg-stone-50 text-stone-400 border-stone-200'
                          : scelto
                          ? 'bg-rose-50 border-rose-500 text-rose-900'
                          : 'bg-stone-50 hover:bg-stone-100 border-stone-200 text-stone-700'
                      }`}
                    >
                      <span>{obj.label}</span>
                      <span className="text-xs font-black">
                        {scelto ? '✓ Scelto' : '+ Metti'}
                      </span>
                    </button>
                  );
                })}
              </div>

              <button
                onClick={verificaZaino}
                disabled={zainoCompletato}
                className={`w-full py-3 rounded-2xl font-black text-xs transition ${
                  zainoCompletato
                    ? 'bg-emerald-600 text-white'
                    : 'bg-stone-900 hover:bg-stone-800 text-white'
                }`}
              >
                {zainoCompletato ? 'Zaino Completo! (+5 pt vinti ✓)' : `Verifica Zaino (${zainoScelti.length}/4 selezionati)`}
              </button>
            </div>
          )}

          {/* GIOCO 5: PAROLA MISTERIOSA EMATICA (+3 PT) */}
          {giocoAttivo === 'parola' && (
            <div className="bg-white rounded-3xl p-5 border border-stone-200/80 shadow-sm space-y-3.5 text-xs">
              <div className="flex items-center justify-between">
                <span className="text-[10px] font-black uppercase text-rose-700 bg-rose-50 px-2 py-0.5 rounded-md">
                  Parola {indiceParola + 1} di 4 · +3 pt
                </span>
                <button
                  onClick={() => {
                    setIndiceParola((prev) => (prev + 1) % paroleMisteriose.length);
                    setInputParola('');
                  }}
                  className="text-[11px] font-bold text-stone-500 underline"
                >
                  Cambia parola →
                </button>
              </div>

              <div className="p-3.5 bg-stone-50 rounded-2xl border border-stone-200 space-y-2">
                <p className="font-bold text-stone-800 leading-snug">
                  💡 {parolaAttuale.indizio}
                </p>
                <div className="flex space-x-1 justify-center pt-1">
                  {parolaAttuale.parola.split('').map((l, i) => (
                    <span
                      key={i}
                      className="w-6 h-7 rounded-lg bg-white border border-stone-300 flex items-center justify-center font-mono font-black text-stone-900"
                    >
                      {paroleIndovinate[parolaAttuale.parola] || i === 0 ? l : '_'}
                    </span>
                  ))}
                </div>
              </div>

              {!paroleIndovinate[parolaAttuale.parola] ? (
                <div className="flex space-x-2">
                  <input
                    type="text"
                    value={inputParola}
                    onChange={(e) => setInputParola(e.target.value)}
                    onKeyDown={(e) => e.key === 'Enter' && verificaParola()}
                    placeholder="Scrivi la parola..."
                    className="flex-1 px-3 py-2.5 bg-stone-100 rounded-xl font-bold uppercase focus:outline-none focus:ring-2 focus:ring-rose-500"
                  />
                  <button
                    onClick={verificaParola}
                    className="px-4 py-2.5 bg-rose-600 text-white rounded-xl font-black"
                  >
                    Verifica
                  </button>
                </div>
              ) : (
                <div className="p-3 bg-emerald-50 text-emerald-800 font-black rounded-xl text-center">
                  ✓ Indovinata! (+3 pt aggiunti)
                </div>
              )}
            </div>
          )}

          {/* GIOCO 6: MEMORY EMATICO (+4 PT) */}
          {giocoAttivo === 'memory' && (
            <div className="bg-white rounded-3xl p-5 border border-stone-200/80 shadow-sm space-y-3">
              <div className="flex items-center justify-between">
                <h3 className="text-sm font-black text-stone-900">Abbina le 4 Coppie (+4 pt)</h3>
                <button
                  onClick={() => {
                    setIndovinate([]);
                    setScoperte([]);
                    setCarte([...carteIniziali].sort(() => Math.random() - 0.5));
                  }}
                  className="text-xs font-bold text-rose-600"
                >
                  Mescola ↻
                </button>
              </div>
              <div className="grid grid-cols-4 gap-2">
                {carte.map((c) => {
                  const visibile = scoperte.includes(c.id) || indovinate.includes(c.coppiaId);
                  return (
                    <button
                      key={c.id}
                      onClick={() => giraCarta(c)}
                      className={`h-16 rounded-2xl border text-[11px] font-black p-1 transition flex items-center justify-center text-center ${
                        visibile ? 'bg-rose-50 border-rose-400 text-rose-900' : 'bg-stone-100 border-stone-200 text-stone-400'
                      }`}
                    >
                      {visibile ? c.label : '?'}
                    </button>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      )}

      {couponAttivo && (
        <ModaleCouponLive coupon={couponAttivo} onClose={() => setCouponAttivo(null)} />
      )}
    </div>
  );
}

// ============================================================================
// MODALE SUPER PERSONALIZZAZIONE GOCCIA MASCOTTE (35+ OPZIONI, 5 TAB)
// ============================================================================
function ModalePersonalizzaAvatar({
  avatar,
  setAvatar,
  vestiSbloccate,
  setVestiSbloccate,
  accessoriSbloccati,
  setAccessoriSbloccati,
  gocceTotali,
  setGocceTotali,
  profilo,
  onClose,
  mostraNotifica
}) {
  const [tab, setTab] = useState('abiti'); // 'abiti' | 'testa' | 'studio' | 'viso' | 'colore'

  // 1. 8 Capi di Abbigliamento Universitario (Prezzi riproporzionati)
  const catalogoAbiti = [
    { id: 'nessuno', nome: 'Goccia Naturale (Base)', costo: 0 },
    { id: 'felpa_unipv', nome: '🧥 Felpa Bordeaux "UNIPV 1361"', costo: 25 },
    { id: 'tshirt_avis', nome: '👕 T-Shirt "IN VEIN Pavia"', costo: 30 },
    { id: 'sciarpa_unipv', nome: '🧣 Maxi Sciarpa Invernale UniPv', costo: 35 },
    { id: 'camice_med', nome: '🥼 Camice Medicina / Laboratorio', costo: 45 },
    { id: 'giacca_cus', nome: '🎽 Giacca Sportiva CUS Pavia', costo: 55 },
    { id: 'pullover_collegio', nome: '👔 Pullover Collegio Universitario', costo: 70 },
    { id: 'toga_laurea', nome: '🖤 Toga Nera e Oro da Laurea', costo: 110 }
  ];

  // 2. 7 Copricapi & Accessori Testa
  const catalogoTesta = [
    { id: 'nessuno', nome: 'Testa Libera (Base)', costo: 0 },
    { id: 'cappellino_campus', nome: '🧢 Cappellino con Visiera UniPv', costo: 20 },
    { id: 'fascia_cus', nome: '🏃 Fascia Sportiva CUS Pavia', costo: 25 },
    { id: 'berretto_lana', nome: '🧶 Berretto Lana Sessione Invernale', costo: 30 },
    { id: 'cuffie_studio', nome: '🎧 Cuffie Wireless da Biblioteca', costo: 35 },
    { id: 'corona_alloro', nome: '🌿 Corona d\'Alloro 110L', costo: 80 },
    { id: 'tocco_laurea', nome: '🎓 Tocco Accademico con Nappa d\'Oro', costo: 100 }
  ];

  // 3. 7 Materiali da Studio in Mano
  const catalogoStudio = [
    { id: 'nessuno', nome: 'Mani Libere (Base)', costo: 0 },
    { id: 'evidenziatore', nome: '🖍️ Evidenziatore Giallo Fluorescente', costo: 15 },
    { id: 'quaderno', nome: '📓 Quaderno Appunti & Dispense A4', costo: 25 },
    { id: 'caffe_studio', nome: '☕ Tazza Maxi Caffè da Esame', costo: 30 },
    { id: 'borraccia', nome: '🍼 Borraccia Termica da Biblioteca', costo: 40 },
    { id: 'microscopio', nome: '🔬 Microscopio da Laboratorio', costo: 60 },
    { id: 'laptop', nome: '💻 Laptop Tesi e Slide', costo: 85 }
  ];

  // 4. Viso: Occhiali + Espressioni
  const catalogoViso = [
    { id: 'nessuno', nome: 'Viso Pulito', costo: 0 },
    { id: 'cerotto', nome: '🩹 Cerottino Donatore (Base)', costo: 0 },
    { id: 'occhiali_studio', nome: '👓 Occhiali da Biblioteca', costo: 20 },
    { id: 'occhiali_sole', nome: '🕶️ Occhiali da Sole Cortile', costo: 35 }
  ];

  const espressioni = [
    { id: 'sorridente', label: '😊 Sorridente' },
    { id: 'entusiasta', label: '😄 Felice' },
    { id: 'concentrata', label: '🤓 Studio' },
    { id: 'occhietto', label: '😉 Occhietto' }
  ];

  // 5. 5 Colori della Goccia
  const catalogoColori = [
    { id: 'rubino', nome: '🔴 Rosso Rubino Classico (Base)', costo: 0, hex: '#E11D48' },
    { id: 'amarena', nome: '🍷 Bordeaux Amarena UniPv', costo: 25, hex: '#9F1239' },
    { id: 'plasma', nome: '🟡 Oro Plasmaferesi', costo: 40, hex: '#F59E0B' },
    { id: 'corallo', nome: '🌸 Corallo Brillante', costo: 50, hex: '#F43F5E' },
    { id: 'imperiale', nome: '👑 Cremisi Rettorale', costo: 75, hex: '#881337' }
  ];

  const gestisciAcquisto = (chiaveConfig, prefissoSblocco, item) => {
    const token = `${prefissoSblocco}:${item.id}`;
    const giaSbloccato = item.costo === 0 || vestiSbloccate.includes(token) || accessoriSbloccati.includes(token);

    if (giaSbloccato) {
      setAvatar((prev) => ({ ...prev, [chiaveConfig]: item.id }));
    } else if (gocceTotali >= item.costo) {
      setGocceTotali((prev) => prev - item.costo);
      setVestiSbloccate((prev) => [...prev, token]);
      setAvatar((prev) => ({ ...prev, [chiaveConfig]: item.id }));
      mostraNotifica('Oggetto Sbloccato! ✨', item.nome, -item.costo);
    } else {
      mostraNotifica('Punti insufficienti', `Servono ${item.costo} punti. Gioca nei 6 minigiochi per ottenerli!`, 0);
    }
  };

  const renderLista = (lista, chiaveConfig, prefisso) => (
    <div className="space-y-2">
      {lista.map((item) => {
        const token = `${prefisso}:${item.id}`;
        const sbloccato = item.costo === 0 || vestiSbloccate.includes(token) || accessoriSbloccati.includes(token);
        const inUso = avatar[chiaveConfig] === item.id;
        return (
          <button
            key={item.id}
            onClick={() => gestisciAcquisto(chiaveConfig, prefisso, item)}
            className={`w-full p-2.5 rounded-2xl border flex items-center justify-between transition ${
              inUso ? 'bg-rose-50 border-rose-500 ring-1 ring-rose-400' : 'bg-white border-stone-200 hover:bg-stone-50'
            }`}
          >
            <div className="flex items-center space-x-2">
              {item.hex && <span className="w-4 h-4 rounded-full border border-stone-300" style={{ backgroundColor: item.hex }} />}
              <span className="font-bold text-stone-900 text-left">{item.nome}</span>
            </div>
            <span className={`text-[10px] font-black px-2 py-1 rounded-lg shrink-0 ${
              inUso ? 'bg-rose-600 text-white' : sbloccato ? 'bg-stone-100 text-stone-700' : 'bg-amber-100 text-amber-800'
            }`}>
              {inUso ? 'In uso ✓' : sbloccato ? 'Usa' : `${item.costo} pt`}
            </span>
          </button>
        );
      })}
    </div>
  );

  return (
    <div className="fixed inset-0 z-50 bg-stone-900/80 backdrop-blur-sm flex items-center justify-center p-3">
      <div className="bg-white w-full max-w-sm rounded-[2.5rem] p-5 shadow-2xl border border-stone-200 space-y-3.5 max-h-[90vh] flex flex-col">
        <div className="flex items-center justify-between shrink-0">
          <div>
            <h3 className="text-base font-black text-stone-900">Atelier Goccia UniPv</h3>
            <p className="text-[11px] text-stone-500">35+ opzioni di abbigliamento e studio</p>
          </div>
          <button onClick={onClose} className="w-8 h-8 rounded-full bg-stone-100 font-bold text-xs">✕</button>
        </div>

        {/* Anteprima Live */}
        <div className="flex items-center justify-center space-x-4 bg-rose-50/40 border border-rose-100 p-3 rounded-3xl shrink-0">
          <CustomAvatar config={avatar} size="xl" />
          <div>
            <div className="text-sm font-black text-stone-900">Goccia di {profilo.nome}</div>
            <div className="text-xs font-black text-rose-600">{gocceTotali.toLocaleString()} Punti</div>
            <button
              onClick={() => {
                setGocceTotali((p) => p + 50);
                mostraNotifica('+50 pt Demo aggiunti!', 'Prova subito tutti i costumi UniPv.', 50);
              }}
              className="mt-1.5 px-2 py-1 bg-amber-100 hover:bg-amber-200 text-amber-900 rounded-lg text-[10px] font-black transition"
            >
              🧪 +50 pt Demo
            </button>
          </div>
        </div>

        {/* 5 Tabs Categorie */}
        <div className="flex space-x-1 bg-stone-100 p-1 rounded-xl text-[11px] font-bold shrink-0 overflow-x-auto no-scrollbar">
          {[
            { id: 'abiti', label: '👕 Abiti' },
            { id: 'testa', label: '🎓 Testa' },
            { id: 'studio', label: '📓 Studio' },
            { id: 'viso', label: '👓 Viso' },
            { id: 'colore', label: '🎨 Colore' }
          ].map((t) => (
            <button
              key={t.id}
              onClick={() => setTab(t.id)}
              className={`flex-1 py-1.5 px-2 rounded-lg shrink-0 ${tab === t.id ? 'bg-white shadow-sm text-stone-900' : 'text-stone-500'}`}
            >
              {t.label}
            </button>
          ))}
        </div>

        {/* Contenuto Scrollabile */}
        <div className="flex-1 overflow-y-auto pr-1 text-xs space-y-3">
          {tab === 'abiti' && renderLista(catalogoAbiti, 'abbigliamento', 'ab')}
          {tab === 'testa' && renderLista(catalogoTesta, 'copricapo', 'ts')}
          {tab === 'studio' && renderLista(catalogoStudio, 'oggettoStudio', 'st')}
          {tab === 'colore' && renderLista(catalogoColori, 'coloreGoccia', 'cl')}

          {tab === 'viso' && (
            <div className="space-y-3">
              <div>
                <span className="text-[11px] font-bold text-stone-500 block mb-1.5">Espressione:</span>
                <div className="grid grid-cols-2 gap-1.5">
                  {espressioni.map((e) => (
                    <button
                      key={e.id}
                      onClick={() => setAvatar((prev) => ({ ...prev, espressione: e.id }))}
                      className={`py-2 rounded-xl font-bold border ${
                        avatar.espressione === e.id ? 'bg-stone-900 text-white border-stone-900' : 'bg-stone-50 text-stone-700 border-stone-200'
                      }`}
                    >
                      {e.label}
                    </button>
                  ))}
                </div>
              </div>

              <div>
                <span className="text-[11px] font-bold text-stone-500 block mb-1.5">Occhiali & Cerotto:</span>
                {renderLista(catalogoViso, 'visoAccessorio', 'vs')}
              </div>
            </div>
          )}
        </div>

        <button
          onClick={onClose}
          className="w-full py-3 bg-rose-600 text-white rounded-2xl text-xs font-black shrink-0"
        >
          Salva Goccia Mascotte
        </button>
      </div>
    </div>
  );
}

// ============================================================================
// PULSANTE NAV INFERIORE LEGGERO E MINIMALISTA (ICONE SVG SOTTILI)
// ============================================================================
function PulsanteNav({ Icona, etichetta, attivo, onClick }) {
  return (
    <button
      onClick={onClick}
      className={`flex flex-col items-center justify-center py-1 px-1.5 rounded-2xl transition duration-150 ${
        attivo ? 'text-rose-600' : 'text-stone-400 hover:text-stone-600'
      }`}
    >
      <Icona className={`w-5 h-5 transition-transform ${attivo ? 'scale-105 stroke-[2.4]' : 'stroke-[1.8]'}`} />
      <span className={`text-[9.5px] mt-1 tracking-tight whitespace-nowrap ${attivo ? 'text-rose-600 font-black' : 'text-stone-400 font-semibold'}`}>
        {etichetta}
      </span>
    </button>
  );
}

// ============================================================================
// COMPONENTE PRINCIPALE APP: IN VEIN PAVIA
// ============================================================================
function App() {
  const [registrato, setRegistrato] = useState(false);
  const [schedaAttiva, setSchedaAttiva] = useState('home'); // 'home' | 'quiz' | 'tutor' | 'visita' | 'sedi' | 'bonus'
  const [gocceConoscenza, setGocceConoscenza] = useState(45);

  const [passo1Completato, setPasso1Completato] = useState(false);
  const [passo2Completato, setPasso2Completato] = useState(false);
  const [passo3Completato, setPasso3Completato] = useState(false);

  const [timestampDonazione, setTimestampDonazione] = useState(null);
  const [giorniDemoOffset, setGiorniDemoOffset] = useState(0);
  const [tipoDonatrice, setTipoDonatrice] = useState('donna_120');

  const [profilo, setProfilo] = useState({
    nome: 'Serena',
    cognome: 'Rossi',
    facolta: 'Area Umanistica e Psicologica (Psicologia, Filosofia, Lettere, Lingue)',
    email: 'serena.rossi@gmail.com'
  });

  const [avatar, setAvatar] = useState({
    coloreGoccia: 'rubino',
    abbigliamento: 'nessuno',
    copricapo: 'nessuno',
    oggettoStudio: 'nessuno',
    visoAccessorio: 'cerotto',
    espressione: 'sorridente'
  });

  const [vestiSbloccate, setVestiSbloccate] = useState([]);
  const [accessoriSbloccati, setAccessoriSbloccati] = useState([]);
  const [modaleAvatarAperta, setModaleAvatarAperta] = useState(false);

  const [notifica, setNotifica] = useState({ visibile: false, titolo: '', messaggio: '', punti: 0 });

  const aggiungiGocce = (q) => {
    setGocceConoscenza((prev) => Math.max(0, prev + q));
  };

  const mostraNotifica = (titolo, messaggio, punti = 0) => {
    setNotifica({ visibile: true, titolo, messaggio, punti });
    setTimeout(() => {
      setNotifica((prev) => ({ ...prev, visibile: false }));
    }, 2800);
  };

  return (
    <div className="min-h-screen bg-stone-900 sm:py-6 flex items-center justify-center font-sans antialiased text-stone-900 select-none">
      <div className="w-full max-w-md bg-[#FDFBF7] flex flex-col relative shadow-2xl sm:rounded-[2.8rem] sm:border-[9px] sm:border-stone-800 h-[100dvh] sm:h-[840px] overflow-hidden">

        {/* SCHERMATA INIZIALE DI REGISTRAZIONE */}
        {!registrato ? (
          <SchermataRegistrazione
            profilo={profilo}
            setProfilo={setProfilo}
            avatar={avatar}
            setModaleAvatarAperta={setModaleAvatarAperta}
            onCompletaRegistrazione={() => {
              setRegistrato(true);
              setSchedaAttiva('home');
              mostraNotifica(`Benvenuta ${profilo.nome}!`, 'Profilo creato con successo.', 0);
            }}
          />
        ) : (
          <>
            {/* 1. HEADER PULITO: SOLO LOGO IN VEIN */}
            <header className="bg-white/95 backdrop-blur-md border-b border-stone-200/70 px-4 py-2.5 shrink-0 z-30 flex items-center justify-between">
              <div className="flex items-center space-x-2.5">
                <div className="w-8 h-8 rounded-xl bg-white border border-stone-200 flex items-center justify-center shadow-sm overflow-hidden p-0.5">
                  <img
                    src="logo.jpeg"
                    alt="IN VEIN"
                    className="w-full h-full object-contain rounded-lg"
                  />
                </div>
                <span className="text-sm font-black tracking-tight text-stone-900">
                  IN VEIN
                </span>
                <span className="px-1.5 py-0.5 bg-stone-100 rounded text-[9px] font-bold text-stone-500 uppercase">
                  Pavia
                </span>
              </div>

              <button
                onClick={() => setSchedaAttiva('bonus')}
                className="px-3 py-1 rounded-full bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs font-black border border-rose-200/80 transition"
              >
                ★ {gocceConoscenza.toLocaleString()} pt
              </button>
            </header>

            {/* 2. CONTENUTO PRINCIPALE */}
            <main className="flex-1 overflow-y-auto overscroll-contain px-4 pt-3 pb-6 space-y-4">
              {schedaAttiva === 'home' && (
                <SchermataHome
                  profilo={profilo}
                  avatar={avatar}
                  setModaleAvatarAperta={setModaleAvatarAperta}
                  passo1Completato={passo1Completato}
                  passo2Completato={passo2Completato}
                  passo3Completato={passo3Completato}
                  setSchedaAttiva={setSchedaAttiva}
                  timestampDonazione={timestampDonazione}
                  setTimestampDonazione={setTimestampDonazione}
                  giorniDemoOffset={giorniDemoOffset}
                  setGiorniDemoOffset={setGiorniDemoOffset}
                  tipoDonatrice={tipoDonatrice}
                  setTipoDonatrice={setTipoDonatrice}
                  mostraNotifica={mostraNotifica}
                />
              )}

              {schedaAttiva === 'quiz' && (
                <SchermataPreQuiz
                  passo1Completato={passo1Completato}
                  setPasso1Completato={setPasso1Completato}
                  setSchedaAttiva={setSchedaAttiva}
                  mostraNotifica={mostraNotifica}
                />
              )}

              {schedaAttiva === 'tutor' && (
                <SchermataTutor
                  passo2Completato={passo2Completato}
                  setPasso2Completato={setPasso2Completato}
                  setSchedaAttiva={setSchedaAttiva}
                  mostraNotifica={mostraNotifica}
                />
              )}

              {schedaAttiva === 'visita' && (
                <SchermataPrenotaVisita
                  passo3Completato={passo3Completato}
                  setPasso3Completato={setPasso3Completato}
                  setSchedaAttiva={setSchedaAttiva}
                  mostraNotifica={mostraNotifica}
                />
              )}

              {schedaAttiva === 'sedi' && (
                <SchermataSediMappa />
              )}

              {schedaAttiva === 'bonus' && (
                <SchermataBonus
                  gocceConoscenza={gocceConoscenza}
                  setGocceConoscenza={setGocceConoscenza}
                  aggiungiGocce={aggiungiGocce}
                  avatar={avatar}
                  profilo={profilo}
                  mostraNotifica={mostraNotifica}
                  setModaleAvatarAperta={setModaleAvatarAperta}
                />
              )}
            </main>

            {/* 3. BARRA INFERIORE LEGGERA E SEPARATA (6 VOCI COMPATTE: VISITA E SEDI SEPARATE) */}
            <nav className="shrink-0 bg-white border-t border-stone-200/80 flex justify-around items-center py-2 px-1 z-30">
              <PulsanteNav
                Icona={Home}
                etichetta="Home"
                attivo={schedaAttiva === 'home'}
                onClick={() => setSchedaAttiva('home')}
              />
              <PulsanteNav
                Icona={ClipboardList}
                etichetta="1° Quiz"
                attivo={schedaAttiva === 'quiz'}
                onClick={() => setSchedaAttiva('quiz')}
              />
              <PulsanteNav
                Icona={Users}
                etichetta="2° Tutor"
                attivo={schedaAttiva === 'tutor'}
                onClick={() => setSchedaAttiva('tutor')}
              />
              <PulsanteNav
                Icona={Calendar}
                etichetta="3° Visita"
                attivo={schedaAttiva === 'visita'}
                onClick={() => setSchedaAttiva('visita')}
              />
              <PulsanteNav
                Icona={MapPin}
                etichetta="Sedi"
                attivo={schedaAttiva === 'sedi'}
                onClick={() => setSchedaAttiva('sedi')}
              />
              <PulsanteNav
                Icona={Trophy}
                etichetta="Premi"
                attivo={schedaAttiva === 'bonus'}
                onClick={() => setSchedaAttiva('bonus')}
              />
            </nav>
          </>
        )}

        {/* TOAST NOTIFICA */}
        {notifica.visibile && (
          <div className="absolute top-16 left-4 right-4 z-50">
            <div className="bg-stone-900 text-white p-3.5 rounded-2xl shadow-xl border border-stone-800 flex items-center justify-between">
              <div>
                <h4 className="text-xs font-black text-white">{notifica.titolo}</h4>
                <p className="text-[11px] text-stone-300">{notifica.messaggio}</p>
              </div>
              {notifica.punti !== 0 && (
                <span className={`text-xs font-black px-2 py-0.5 rounded-full shrink-0 ml-2 ${
                  notifica.punti > 0 ? 'bg-rose-600 text-white' : 'bg-stone-800 text-amber-400'
                }`}>
                  {notifica.punti > 0 ? `+${notifica.punti}` : notifica.punti} pt
                </span>
              )}
            </div>
          </div>
        )}

        {/* MODALE SUPER PERSONALIZZAZIONE GOCCIA MASCOTTE */}
        {modaleAvatarAperta && (
          <ModalePersonalizzaAvatar
            avatar={avatar}
            setAvatar={setAvatar}
            vestiSbloccate={vestiSbloccate}
            setVestiSbloccate={setVestiSbloccate}
            accessoriSbloccati={accessoriSbloccati}
            setAccessoriSbloccati={setAccessoriSbloccati}
            gocceTotali={gocceConoscenza}
            setGocceTotali={setGocceConoscenza}
            profilo={profilo}
            onClose={() => setModaleAvatarAperta(false)}
            mostraNotifica={mostraNotifica}
          />
        )}
      </div>
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
