// BARRA DEI GIORNI CON LA GOCCIA (UNICA BARRA INTERATTIVA & TRASCINABILE)
// ============================================================================
function BarraGocciaProgressiva({
  giorniTrascorsi,
  setGiorniTrascorsi,
  tipoDonatrice,
  setTipoDonatrice
}) {
  const durate = { donna: 120, uomo: 90, plasma: 30 };
  const giorniTotali = durate[tipoDonatrice] || 120;
  const percentuale = Math.min(100, Math.max(0, Math.round((giorniTrascorsi / giorniTotali) * 100)));
  const giorniRimanenti = Math.max(0, giorniTotali - giorniTrascorsi);

  const selezionaTipo = (tipo) => {
    setTipoDonatrice(tipo);
    const maxG = durate[tipo];
    if (giorniTrascorsi > maxG) {
      setGiorniTrascorsi(maxG);
    }
  };

  return (
    <div className="bg-white p-5 rounded-3xl border border-stone-200/80 shadow-sm space-y-4">
      <div className="flex items-center justify-between">
        <div>
          <span className="text-[10px] font-black uppercase tracking-wider text-rose-700 bg-rose-50 border border-rose-200/70 px-2 py-0.5 rounded-md inline-block">

          </span>

        </div>
        <div className="text-right">
          <span className="text-xs font-black text-rose-700 bg-rose-50 px-2.5 py-1 rounded-xl border border-rose-200">
            {giorniRimanenti === 0 ? 'Idonea Oggi! 🎉' : `-${giorniRimanenti} giorni`}
          </span>
        </div>
      </div>

      {/* SELETTORE RAPIDO SANGUE DONNA / UOMO / PLASMA */}
      <div className="grid grid-cols-3 gap-1.5 bg-stone-100 p-1 rounded-2xl text-[11px] font-bold">
        <button
          onClick={() => selezionaTipo('donna')}
          className={`py-2 px-1 rounded-xl transition text-center ${
            tipoDonatrice === 'donna' ? 'bg-white text-rose-700 shadow-sm font-black' : 'text-stone-600 hover:text-stone-900'
          }`}
        >
          Donna (120g)
        </button>
        <button
          onClick={() => selezionaTipo('uomo')}
          className={`py-2 px-1 rounded-xl transition text-center ${
            tipoDonatrice === 'uomo' ? 'bg-white text-blue-700 shadow-sm font-black' : 'text-stone-600 hover:text-stone-900'
          }`}
        >
          Uomo (90g)
        </button>
        <button
          onClick={() => selezionaTipo('plasma')}
          className={`py-2 px-1 rounded-xl transition text-center ${
            tipoDonatrice === 'plasma' ? 'bg-white text-amber-700 shadow-sm font-black' : 'text-stone-600 hover:text-stone-900'
          }`}
          title="Consigliata se hai ferro o ferritina variabile!"
        >
          Plasma (30g)
        </button>
      </div>

      {tipoDonatrice === 'plasma' && (
        <p className="text-[11px] bg-amber-50 border border-amber-200 text-amber-900 p-2.5 rounded-xl font-medium leading-relaxed">
          💡 <strong>Plasmaferesi (Consigliata per ferro basso):</strong> trattiene solo il plasma reintegrando i globuli rossi. Ideale per le studentesse con ferritina variabile!
        </p>
      )}

      {/* UNICA BARRA INTERATTIVA: L'INPUT RANGE È SOVRAPPOSTO DIRETTAMENTE SULLA BARRA */}
      <div className="pt-5 pb-1 px-1">
        <div className="flex justify-between items-center text-[10px] text-stone-500 font-bold mb-2">
          <span className="flex items-center gap-1 text-stone-700">
            <Sparkles className="w-3.5 h-3.5 text-rose-600" />
            ↔ Trascina direttamente la goccia per simulare i giorni
          </span>
          <span className="font-mono font-black text-rose-700">
            {giorniTrascorsi} / {giorniTotali} gg ({percentuale}%)
          </span>
        </div>

        <div className="relative w-full h-8 flex items-center">
          {/* Traccia di sfondo */}
          <div className="w-full h-3.5 bg-stone-100 rounded-full border border-stone-200 relative overflow-hidden">
            <div
              className="h-full bg-gradient-to-r from-rose-400 via-rose-500 to-rose-600 rounded-full transition-all duration-150"
              style={{ width: `${percentuale}%` }}
            />
          </div>

          {/* Goccia Animata Visibile */}
          <div
            className="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 pointer-events-none transition-all duration-150 z-20 flex flex-col items-center"
            style={{ left: `${Math.max(4, Math.min(96, percentuale))}%` }}
          >
            <div className="absolute -top-7 bg-stone-900 text-white text-[10px] font-black px-2 py-0.5 rounded-full shadow-md whitespace-nowrap flex items-center gap-1 border border-stone-700">
              <span>Giorno {giorniTrascorsi}</span>
            </div>
            <div className="w-8 h-8 rounded-full bg-rose-600 border-2 border-white shadow-lg flex items-center justify-center text-white ring-2 ring-rose-300">
              <Droplet className="w-4 h-4 fill-white text-white animate-pulse" />
            </div>
          </div>

          {/* INPUT RANGE INVISIBILE E SOVRAPPOSTO: L'utente trascina fisicamente la goccia */}
          <input
            type="range"
            min="1"
            max={giorniTotali}
            value={giorniTrascorsi}
            onChange={(e) => setGiorniTrascorsi(Number(e.target.value))}
            className="opacity-0 absolute inset-0 w-full h-12 cursor-grab active:cursor-grabbing z-30 m-0"
            title="Trascina la goccia lungo la barra"
          />
        </div>

        {/* 4 TRAGUARDI IN GRIGLIA A 4 COLONNE: ZERO TESTI A CAPO */}
        <div className="grid grid-cols-4 gap-1 text-center text-[10px] font-bold text-stone-500 mt-4 pt-1 border-t border-stone-100">
          <div className="bg-stone-50 p-1.5 rounded-xl border border-stone-200/60">
            <span className="block text-stone-800 font-black">Giorno 1</span>
            <span className="text-[9px] text-stone-400">Inizio</span>
          </div>
          <div className="bg-stone-50 p-1.5 rounded-xl border border-stone-200/60">
            <span className="block text-stone-800 font-black">Giorno {Math.round(giorniTotali * 0.25)}</span>
            <span className="text-[9px] text-blue-600 font-bold">💧 Plasma</span>
          </div>
          <div className="bg-stone-50 p-1.5 rounded-xl border border-stone-200/60">
            <span className="block text-stone-800 font-black">Giorno {Math.round(giorniTotali * 0.5)}</span>
            <span className="text-[9px] text-amber-600 font-bold">⚡ Ferro</span>
          </div>
          <div className="bg-stone-50 p-1.5 rounded-xl border border-stone-200/60">
            <span className="block text-rose-700 font-black">Giorno {giorniTotali}</span>
            <span className="text-[9px] text-rose-600 font-bold">🎯 Idonea</span>
          </div>
        </div>
      </div>

      {/* Feedback Biologico */}
      <div className="bg-stone-50 border border-stone-200/80 p-3.5 rounded-2xl flex items-center gap-3">
        <div className="w-9 h-9 rounded-xl bg-rose-100 text-rose-700 flex items-center justify-center shrink-0">
          <HeartPulse className="w-5 h-5 text-rose-600" />
        </div>
        <p className="text-[11px] text-stone-700 leading-snug">
          {percentuale < 30 && (
            <span>💧 <strong>Volume plasmatico ripristinato:</strong> componente liquida rigenerata in 24-48h con l'acqua. Ora il midollo sintetizza nuovi globuli rossi.</span>
          )}
          {percentuale >= 30 && percentuale < 100 && (
            <span>⚡ <strong>Ricostituzione cellulare ({percentuale}%):</strong> scorte di ferritina e globuli rossi in piena ripresa. Serena si sente in forze e concentrata per lo studio!</span>
          )}
          {percentuale >= 100 && (
            <span>🎉 <strong>Rigenerazione completata (100%):</strong> il corpo di Serena è pronto. Puoi prenotare il prossimo slot con accesso prioritario in Cortile Centrale!</span>
          )}
        </p>
      </div>
    </div>
  );
}

function ModaleCouponLive({ coupon, onClose }) {
  const [secondi, setSecondi] = useState(300); // 5 minuti precisi

  useEffect(() => {
    if (secondi <= 0) return;
    const timer = setInterval(() => {
      setSecondi((prev) => (prev > 0 ? prev - 1 : 0));
    }, 1000);
    return () => clearInterval(timer);
  }, [secondi]);

  const minuti = Math.floor(secondi / 60);
  const sec = secondi % 60;
  const tempoFormattato = `${String(minuti).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;

  if (!coupon) return null;

  return (
    <div className="fixed inset-0 z-50 bg-stone-900/80 backdrop-blur-sm flex items-center justify-center p-4">

                  <button
                    onClick={() => riscattaPremio(premio)}
                    disabled={!puoRiscattare}
                    className={`w-full py-2.5 rounded-2xl text-xs font-black transition ${
                      puoRiscattare
                        ? 'bg-rose-600 hover:bg-rose-700 text-white shadow-md shadow-rose-600/20 active:scale-95'
                        : 'bg-stone-100 text-stone-400 cursor-not-allowed'
                    }`}
                  >
                    {puoRiscattare
                      ? `🎁 Riscatta Coupon Live (${premio.costo} Gocce)`
                      : `Mancano ${premio.costo - puntiUtente} Gocce`}

                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* MODALE DEL COUPON LIVE SE APERTO */}
      {couponAttivo && (
        <ModaleCouponLive
          coupon={couponAttivo}
          onClose={() => setCouponAttivo(null)}
        />
      )}
    </div>
  );
}

// ============================================================================
// MODALE CONVALIDA CLINICA (SIMT SAN MATTEO PAVIA)
// ============================================================================
function ModaleConvalidaClinica({
  onClose,
  onConvalida,
  nome,
  facolta
}) {
  const [codice, setCodice] = useState('');
  const [errore, setErrore] = useState('');

  const confermaCodice = () => {
    if (!codice.trim()) {
      setErrore('Inserisci il codice ricevuto dal personale sanitario');
      return;
    }
    onConvalida();
    onClose();
  };

  const simulaConvalida = () => {
    setCodice('SIMT-PV-8821');
    setTimeout(() => {
      onConvalida();
      onClose();
    }, 400);
  };

  return (
    <div className="fixed inset-0 z-50 bg-stone-900/80 backdrop-blur-sm flex items-center justify-center p-4">
      <div className="bg-white w-full max-w-sm rounded-[2.5rem] p-6 shadow-2xl border border-stone-200 text-center space-y-4 animate-in fade-in zoom-in duration-200">
        <div className="w-12 h-12 rounded-full bg-rose-50 text-rose-600 flex items-center justify-center mx-auto text-xl font-bold">
          💉
        </div>

        <div>
          <h3 className="text-base font-black text-stone-900">
            Convalida Donazione SIMT
          </h3>
          <p className="text-xs text-stone-500 mt-1">
            Centro Trasfusionale • Policlinico San Matteo Pavia
          </p>
        </div>

        <p className="text-xs text-stone-600 leading-relaxed">
          Inserisci il codice numerico a 6 cifre rilasciato dal medico dopo il prelievo per accreditare <strong>+300 Gocce</strong> a Serena e a <strong>{facolta}</strong>!
        </p>

        <div className="space-y-1">
          <input
            type="text"
            placeholder="Es. SIMT-PV-8821"
            value={codice}
            onChange={(e) => { setCodice(e.target.value); setErrore(''); }}
            className="w-full text-center tracking-widest font-mono text-sm py-3 px-4 bg-stone-50 border border-stone-300 rounded-2xl focus:outline-none focus:ring-2 focus:ring-rose-500"
          />
          {errore && <p className="text-[11px] text-rose-600 font-bold">{errore}</p>}
        </div>

        <div className="space-y-2 pt-1">
          <button
            onClick={confermaCodice}
            className="w-full py-3 bg-rose-600 hover:bg-rose-700 text-white rounded-2xl text-xs font-black shadow-md shadow-rose-600/20 active:scale-95 transition"
          >
            Conferma Donazione Effettuata
          </button>

          <button
            onClick={simulaConvalida}
            className="w-full py-2.5 bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-200 rounded-2xl text-xs font-bold transition flex items-center justify-center space-x-1"
          >
            <span>⚡ Simula Convalida Medica Rapida (Demo)</span>
          </button>

          <button
            onClick={onClose}
            className="w-full py-2 text-stone-400 hover:text-stone-600 text-xs font-bold transition"
          >
            Annulla
          </button>
        </div>
      </div>
    </div>
  );
}

      </span>
      {badge && (
        <span className="absolute top-0 right-2 w-4 h-4 bg-rose-600 text-white text-[9px] font-black rounded-full flex items-center justify-center ring-2 ring-white animate-pulse">
          {badge}
        </span>
      )}
    </button>
  );
}

// ============================================================================
// COMPONENTE PRINCIPALE: IN VEIN PAVIA (UNIPV NUDGEATHON 2026)
// ============================================================================
function App() {
  const [schedaAttiva, setSchedaAttiva] = useState('home'); // 'home' | 'missioni' | 'compagno' | 'classifiche'
  const [gocceTotali, setGocceTotali] = useState(330);
  const [giorniSerie, setGiorniSerie] = useState(5);
  const [scudoEsamiAttivo, setScudoEsamiAttivo] = useState(false); // Toggle libero Scudo Ghiaccio!
  const [idratazioneOggi, setIdratazioneOggi] = useState(false);

  // Barra Progressiva Fisiologica
  const [giorniTrascorsi, setGiorniTrascorsi] = useState(18);
  const [tipoDonatrice, setTipoDonatrice] = useState('donna_120');

  // Stato Donazione & Percorso Clinico
  const [donazioneConvalidata, setDonazioneConvalidata] = useState(false);
  const [idoneitaVerificata, setIdoneitaVerificata] = useState(false);
  const [compagnoPrenotato, setCompagnoPrenotato] = useState(false);

  // Modali
  const [modaleVerificaAperta, setModaleVerificaAperta] = useState(false);
  const [modaleAvatarAperta, setModaleAvatarAperta] = useState(false);
  const [modaleConvalidaAperta, setModaleConvalidaAperta] = useState(false);

  // Stato Quiz Giornalieri (3 set)
  const [giornataQuiz, setGiornataQuiz] = useState(1);
  const [risposteQuiz, setRisposteQuiz] = useState({});
  const [bauleGiornoRiscattato, setBauleGiornoRiscattato] = useState({});
  const [scossaInviata, setScossaInviata] = useState(false);
  const [couponRiscattati, setCouponRiscattati] = useState([]);

  // Notifiche Toast
  const [notifica, setNotifica] = useState({ visibile: false, titolo: '', messaggio: '', punti: 0 });

  // Profilo Utente Serena
  const [profilo, setProfilo] = useState({
    nome: 'Serena',
    eta: 21,
    facolta: 'Psicologia',
    annoCorso: '3° Anno',
    email: 'serena.rossi01@universitadipavia.it',
    ruoloUtente: 'neo',
    gruppoSanguigno: null
  });

  // Avatar Serena
  const [avatar, setAvatar] = useState({
    abito: 'felpa_rossa',
    felpa: 'felpa_rossa',
    carnagione: 'chiara',
    capelli: 'raccolti',
    accessorio: 'cerotto'
  });

  // Oggetti Sbloccati
  const [vestiSbloccate, setVestiSbloccate] = useState(['felpa_rossa']);
  const [accessoriSbloccati, setAccessoriSbloccati] = useState(['nessuno', 'cerotto']);

  // Chat Tutor Iniziale
  const [chatMessaggi, setChatMessaggi] = useState([
    {
      id: 1,
      mittente: 'tutor',
      testo: 'Ciao Serena! Piacere, sono Marco di Medicina (5° anno). Ti accompagnerò io alla donazione in emoteca per qualsiasi dubbio o per farti coraggio!',
      orario: '09:45',
      spunte: true
    }
  ]);

  // Utility Aggiungi Gocce
  const aggiungiGocce = (quantita) => {
    setGocceTotali((prev) => Math.max(0, prev + quantita));
  };

  // Toast Notifica Helper
  const mostraNotifica = (titolo, messaggio, punti = 0) => {
    setNotifica({ visibile: true, titolo, messaggio, punti });
    setTimeout(() => {
      setNotifica((prev) => ({ ...prev, visibile: false }));
    }, 3200);
  };

  // TOGGLE LIBERO SCUDO GHIACCIO (ATTIVA / DISATTIVA CON RIMBORSO)
  const toggleScudoEsami = () => {
    if (!scudoEsamiAttivo) {
      if (gocceTotali >= 50) {
        setGocceTotali((prev) => prev - 50);
        setScudoEsamiAttivo(true);
        mostraNotifica('❄️ Scudo Serie Attivato (-50 Gocce)', 'La tua serie è protetta se salti un giorno.', -50);
      } else {
        mostraNotifica('⚠️ Gocce insufficienti', 'Servono almeno 50 Gocce per attivare lo Scudo!', 0);
      }
    } else {
      setScudoEsamiAttivo(false);
      setGocceTotali((prev) => prev + 50);
      mostraNotifica('Scudo Disattivato (+50 Gocce rimborsate)', 'Le 50 Gocce sono tornate disponibili.', 50);
    }
  };

  // Convalida Donazione Finale SIMT
  const eseguiConvalidaDonazione = () => {
    setDonazioneConvalidata(true);
    aggiungiGocce(300);
    setProfilo((prev) => ({ ...prev, gruppoSanguigno: '0+' }));
    mostraNotifica('Donazione Convalidata! 🩸', '+300 Gocce! Hai scoperto il tuo gruppo sanguigno: 0+.', 300);
  };

  return (
    <div className="min-h-screen bg-stone-900 sm:py-6 flex items-center justify-center font-sans antialiased text-stone-900 select-none">
      {/* FRAME SMARTPHONE RIGIDO: FIX DEFINITIVO SCROLL BOTTOM NAV */}
      <div className="w-full max-w-md bg-[#FDFBF7] flex flex-col relative shadow-2xl sm:rounded-[2.8rem] sm:border-[9px] sm:border-stone-800 h-[100dvh] sm:h-[840px] overflow-hidden">

        {/* 1. HEADER IN ALTO (SHRINK-0 Z-30) */}
        <header className="bg-white/90 backdrop-blur-md border-b border-stone-200/80 px-4 py-2.5 shrink-0 z-30 flex items-center justify-between">
          {/* LOGO & TITOLO */}
          <div className="flex items-center space-x-2">
            <div className="w-8 h-8 rounded-xl bg-gradient-to-tr from-rose-600 to-rose-500 flex items-center justify-center shadow-md shadow-rose-600/30 text-white">
              <Droplets className="w-4 h-4 fill-white" />
            </div>
            <div className="flex items-center space-x-1.5">
              <span className="text-sm font-black tracking-tight text-stone-900">
                IN VEIN
              </span>
              <button
                onClick={() => setModaleVerificaAperta(true)}
                className="px-1.5 py-0.5 bg-stone-100 hover:bg-stone-200 rounded text-[9px] font-black text-stone-700 tracking-wider transition uppercase"
              >
                PAVIA
              </button>
            </div>
          </div>

          {/* 3 PILLOLE COMPATTE SU UNA SOLA RIGA: SCUDO TOGGLE, SERIE, GOCCE */}
          <div className="flex items-center space-x-1.5">
            {/* TOGGLE SCUDO GHIACCIO */}
            <button
              onClick={toggleScudoEsami}
              className={`px-2.5 py-1 rounded-full text-xs font-black transition flex items-center space-x-1 ${
                scudoEsamiAttivo
                  ? 'bg-cyan-100 text-cyan-800 ring-2 ring-cyan-400'
                  : 'bg-stone-100 hover:bg-stone-200 text-stone-700'
              }`}
            >
              <span>{scudoEsamiAttivo ? '❄️ Scudo ON ✕' : '❄️ Scudo'}</span>
            </button>

            {/* PILLOLA SERIE GIORNI */}
            <div className="px-2.5 py-1 rounded-full bg-amber-50 text-amber-700 text-xs font-black flex items-center space-x-1 border border-amber-200">
              <span>🔥 {giorniSerie}g</span>
            </div>

            {/* PILLOLA GOCCE */}
            <div className="px-2.5 py-1 rounded-full bg-rose-50 text-rose-700 text-xs font-black flex items-center space-x-1 border border-rose-200">
              <span>🩸 {gocceTotali}</span>
            </div>
          </div>
        </header>

        {/* 2. MAIN CENTRALE CON OVERFLOW-Y-AUTO */}
        <main className="flex-1 overflow-y-auto overscroll-contain px-4 pt-3 pb-6 space-y-4">
          {schedaAttiva === 'home' && (
            <SchermataHome
              profilo={profilo}
              gocce={gocceTotali}
              aggiungiGocce={aggiungiGocce}
              giorniSerie={giorniSerie}
              scudoEsamiAttivo={scudoEsamiAttivo}
              idratazioneOggi={idratazioneOggi}
              setIdratazioneOggi={setIdratazioneOggi}
              giorniTrascorsi={giorniTrascorsi}
              setGiorniTrascorsi={setGiorniTrascorsi}
              tipoDonatrice={tipoDonatrice}
              setTipoDonatrice={setTipoDonatrice}
              donazioneConvalidata={donazioneConvalidata}
              idoneitaVerificata={idoneitaVerificata}
              compagnoPrenotato={compagnoPrenotato}
              avatar={avatar}
              setModaleAvatarAperta={setModaleAvatarAperta}
              setModaleVerificaAperta={setModaleVerificaAperta}
              setSchedaAttiva={setSchedaAttiva}
              mostraNotifica={mostraNotifica}
            />
          )}

          {schedaAttiva === 'missioni' && (
            <SchermataMissioniOggi
              gocce={gocceTotali}
              aggiungiGocce={aggiungiGocce}
              giorniSerie={giorniSerie}
              setGiorniSerie={setGiorniSerie}
              mostraNotifica={mostraNotifica}
              giornataQuiz={giornataQuiz}
              setGiornataQuiz={setGiornataQuiz}
              risposteQuiz={risposteQuiz}
              setRisposteQuiz={setRisposteQuiz}
              bauleGiornoRiscattato={bauleGiornoRiscattato}
              setBauleGiornoRiscattato={setBauleGiornoRiscattato}
              scossaInviata={scossaInviata}
              setScossaInviata={setScossaInviata}
            />
          )}

          {schedaAttiva === 'compagno' && (
            <SchermataCompagnoDonazione
              idoneitaVerificata={idoneitaVerificata}
              setIdoneitaVerificata={setIdoneitaVerificata}
              compagnoPrenotato={compagnoPrenotato}
              setCompagnoPrenotato={setCompagnoPrenotato}
              donazioneConvalidata={donazioneConvalidata}
              setModaleConvalidaAperta={setModaleConvalidaAperta}
              aggiungiGocce={aggiungiGocce}
              nome={profilo.nome}
              facolta={profilo.facolta}
              chatMessaggi={chatMessaggi}
              setChatMessaggi={setChatMessaggi}
              mostraNotifica={mostraNotifica}
            />
          )}

          {schedaAttiva === 'classifiche' && (
            <SchermataClassifiche
              puntiUtente={gocceTotali}
              setPuntiUtente={setGocceTotali}
              facolta={profilo.facolta}
              mostraNotifica={mostraNotifica}
              avatar={avatar}
              couponRiscattati={couponRiscattati}
              setCouponRiscattati={setCouponRiscattati}
            />
          )}
        </main>

        {/* 3. NAV IN BASSO (SHRINK-0 Z-30 ANCORATA IN FONDO AL 100%) */}
        <nav className="shrink-0 bg-white border-t border-stone-200 flex justify-around items-center py-2.5 px-1 z-30 shadow-[0_-4px_12px_rgba(0,0,0,0.04)]">
          <PulsanteNav
            icona="🏠"
            etichetta="Home"
            attivo={schedaAttiva === 'home'}
            onClick={() => setSchedaAttiva('home')}
          />
          <PulsanteNav
            icona="🎯"
            etichetta="Quiz & Serie"
            badge={!bauleGiornoRiscattato[giornataQuiz] ? '!' : null}
            attivo={schedaAttiva === 'missioni'}
            onClick={() => setSchedaAttiva('missioni')}
          />
          <PulsanteNav
            icona="🤝"
            etichetta="Tutor & SIMT"
            badge={!compagnoPrenotato ? '1' : null}
            attivo={schedaAttiva === 'compagno'}
            onClick={() => setSchedaAttiva('compagno')}
          />
          <PulsanteNav
            icona="🏆"
            etichetta="Classifica"
            attivo={schedaAttiva === 'classifiche'}
            onClick={() => setSchedaAttiva('classifiche')}
          />
        </nav>

        {/* NOTIFICA TOAST ELEGANTE IN ALTO */}
        {notifica.visibile && (
          <div className="absolute top-16 left-4 right-4 z-50 animate-in fade-in slide-in-from-top duration-300">
            <div className="bg-stone-900 text-white p-3.5 rounded-2xl shadow-xl border border-stone-800 flex items-center justify-between">
              <div>
                <h4 className="text-xs font-black text-white">{notifica.titolo}</h4>
                <p className="text-[11px] text-stone-300 mt-0.5">{notifica.messaggio}</p>
              </div>
              {notifica.punti !== 0 && (
                <span
                  className={`text-xs font-black px-2 py-0.5 rounded-full shrink-0 ml-2 ${
                    notifica.punti > 0
                      ? 'bg-rose-600 text-white'
                      : 'bg-stone-800 text-amber-400'
                  }`}
                >
                  {notifica.punti > 0 ? `+${notifica.punti}` : notifica.punti} 💧
                </span>
              )}
            </div>
          </div>
        )}

        {/* MODALI APP */}
        {modaleVerificaAperta && (
          <ModaleVerificaAteneo
            profilo={profilo}
            setProfilo={setProfilo}
            onClose={() => setModaleVerificaAperta(false)}
            mostraNotifica={mostraNotifica}
          />
        )}

        {modaleAvatarAperta && (
          <ModalePersonalizzaAvatar
            avatar={avatar}
            setAvatar={setAvatar}
            vestiSbloccate={vestiSbloccate}
            setVestiSbloccate={setVestiSbloccate}
            accessoriSbloccati={accessoriSbloccati}
            setAccessoriSbloccati={setAccessoriSbloccati}
            gocceTotali={gocceTotali}
            setGocceTotali={setGocceTotali}
            profilo={profilo}
            setProfilo={setProfilo}
            onClose={() => setModaleAvatarAperta(false)}
            mostraNotifica={mostraNotifica}
          />
        )}

        {modaleConvalidaAperta && (
          <ModaleConvalidaClinica
            onClose={() => setModaleConvalidaAperta(false)}
            onConvalida={eseguiConvalidaDonazione}
            nome={profilo.nome}
            facolta={profilo.facolta}
          />
        )}
      </div>
    </div>
  );
}
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
